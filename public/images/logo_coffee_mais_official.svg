<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <!-- Dark Background Rect -->
  <rect width="600" height="340" rx="24" fill="#1e1e1e"/>
  
  <!-- Line 1: "Coffee" in High-Contrast Modern Serif (Didot / Bodoni style) -->
  <text x="50" y="135" font-family="'Playfair Display', 'Didot', 'Bodoni MT', Georgia, serif" font-size="125" font-weight="700" fill="#ffffff" letter-spacing="-2">Coffee</text>
  
  <!-- Line 2: "++" Right-aligned under the "ee" of Coffee -->
  <g fill="#ffffff">
    <!-- First Plus '+' -->
    <rect x="380" y="182" width="56" height="18" rx="3"/>
    <rect x="399" y="163" width="18" height="56" rx="3"/>
    
    <!-- Second Plus '+' -->
    <rect x="465" y="182" width="56" height="18" rx="3"/>
    <rect x="484" y="163" width="18" height="56" rx="3"/>
  </g>
  
  <!-- Line 3: "Cafés Especiais" below -->
  <text x="300" y="295" font-family="system-ui, -apple-system, 'SF Pro Text', sans-serif" font-size="52" font-weight="400" fill="#ffffff" text-anchor="middle" letter-spacing="1">Cafés Especiais</text>
</svg>
